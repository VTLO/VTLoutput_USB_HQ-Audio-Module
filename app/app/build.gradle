plugins { id 'com.android.application' }

android {
    namespace 'fr.vtlo.usbaudiohq'
    compileSdk 34
    defaultConfig {
        applicationId 'fr.vtlo.usbaudiohq'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '1.6'
    }
    def ksProps = new Properties()
    def ksFile = rootProject.file('keystore.properties')
    if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions { unitTests { includeAndroidResources = true } }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
